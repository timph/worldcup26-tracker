        // Converts a fixture's stadium-local date+time into the visitor's local time
        function convertToUserTime(dateStr, timeStr, stadiumId) {
            try {
                const [month, day, year] = dateStr.split('/');
                const [hour, minute] = timeStr.split(':');
                const stadiumTz = STADIUM_TZ[stadiumId] || "America/Chicago";

                const naive = new Date(Date.UTC(year, month - 1, day, hour, minute));

                const asUTC = new Date(naive.toLocaleString('en-US', { timeZone: 'UTC' }));
                const offsetMs = asUTC - asStadiumTz;

                const trueUTC = new Date(naive.getTime() + offsetMs);

                return trueUTC.toLocaleString('en-US', {
                    timeZone: USER_TZ,
                    hour: '2-digit', minute: '2-digit'
                });

        // Formatter to convert MM/DD/YYYY to readable "June 11, 2026"
        function formatDateString(dateStr) {
            const date = new Date(dateStr);
            if(isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        // Dynamically build available dates from fixture state
        let availableDates = [];
        let selectedDate = "";

        function syncDates() {
            const rawDates = [...new Set(fixtures.map(f => f.date))].sort((a,b) => new Date(a) - new Date(b));
            availableDates = rawDates.map(d => formatDateString(d));
            
            const todayStr = formatDateString(new Date().toLocaleDateString('en-US'));

                selectedDate = availableDates.includes(todayStr) ? todayStr : availableDates[0];

    <script>
        function initTabs() {
            syncDates();
            const tabsContainer = document.getElementById("dateTabs");
            tabsContainer.innerHTML = "";
            availableDates.forEach(date => {
                const isSelected = date === selectedDate;
                const tab = document.createElement("button");
                tab.className = `px-4 py-2.5 rounded-xl font-bold text-xs whitespace-nowrap transition border ${
                    isSelected 
                        ? "bg-cupGold text-darkBg border-cupGold shadow-lg shadow-yellow-600/10 active-tab" 
                        : "bg-cardBg hover:bg-gray-800 text-gray-300 border-gray-800"
                }`;
                tab.innerText = date;
                tab.onclick = () => {
                    selectedDate = date;
                    initTabs();
                    renderMatches();
                };
                tabsContainer.appendChild(tab);
            });

            setTimeout(() => {
                const activeTab = tabsContainer.querySelector('.active-tab');
                if (activeTab) {
                    activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 50);
        }

        function adjustPrediction(fixtureId, teamType, change) {
            const fx = fixtures.find(f => f.id === fixtureId);
            if (fx && fx.status === 'finished') return;

            if (!predictions[fixtureId]) {
                predictions[fixtureId] = {
                    homeScore: fx.homeScore !== null ? fx.homeScore : 0,
                    awayScore: fx.awayScore !== null ? fx.awayScore : 0
                };
            }

            if (teamType === 'home') {
                predictions[fixtureId].homeScore = Math.max(0, predictions[fixtureId].homeScore + change);
            } else {
                predictions[fixtureId].awayScore = Math.max(0, predictions[fixtureId].awayScore + change);
            }

            recalculateStandings();
            renderMatches();
        }

        function clearSinglePrediction(fixtureId) {
            if (predictions[fixtureId]) {
                delete predictions[fixtureId];
                recalculateStandings();
                renderMatches();
            }
        }

        function resetAllPredictions() {
            predictions = {};
            recalculateStandings();
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById("matchContainer");
            container.innerHTML = "";

            const filtered = fixtures
                .filter(f => formatDateString(f.date) === selectedDate)
                .sort((a, b) => {
                    const timeA = a.time.split(':').reduce((h, m) => h * 60 + parseInt(m), 0);
                    const timeB = b.time.split(':').reduce((h, m) => h * 60 + parseInt(m), 0);
                    return timeA - timeB;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">No fixtures listed for ${selectedDate}.</div>`;
                return;
            }

            filtered.forEach(match => {
                // Safeguard: Generate mock objects for unresolved knockout teams ("Winner Match 74")
                const homeTeamObj = TEAMS[match.home] || { name: match.home, flag: "🏳️" };
                const awayTeamObj = TEAMS[match.away] || { name: match.away, flag: "🏳️" };
                const stadiumData = STADIUM_MAP[match.stadiumId] || { name: "Unknown Stadium", city: "" };

                const isSettled = match.status === "finished";
                const isPredicted = predictions[match.id] !== undefined;
                const homeScoreVal = isPredicted ? predictions[match.id].homeScore : (match.homeScore !== null ? match.homeScore : "-");
                const awayScoreVal = isPredicted ? predictions[match.id].awayScore : (match.awayScore !== null ? match.awayScore : "-");

                let badgeHtml = "";
                let cardBorder = "border-gray-800";
                
                let timeBadgeHtml = "";
                if (!isSettled) {
                    const localTime = convertToUserTime(match.date, match.time, match.stadiumId);
                    timeBadgeHtml = `
                        <div class="flex items-center gap-1.5 flex-wrap select-none justify-end">
                            <span class="bg-gray-800 text-gray-400 text-[10px] font-bold px-2 py-0.5 rounded-md border border-gray-700 flex items-center" title="Stadium time: ${match.time}">
                                <i class="fa-regular fa-clock mr-1"></i>${localTime} your time
                            </span>
                        </div>
                    `;
                }
                
                if (isPredicted) {
                    badgeHtml = `
                        <div class="flex items-center gap-2">
                            <span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full border border-emerald-500/10 flex items-center gap-1"><i class="fa-solid fa-square-poll-horizontal"></i> Predicted</span>
                            ${timeBadgeHtml}
                        </div>
                    `;
                    cardBorder = "border-emerald-500/30 shadow-lg shadow-emerald-900/5";
                } else if (isSettled) {
                    badgeHtml = `<span class="bg-gray-800 text-gray-400 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full">Official Result</span>`;
                } else {
                    badgeHtml = timeBadgeHtml;
                }

                const isKnockout = ["R32", "R16", "QF", "SF", "3RD", "FINAL"].includes(match.group);

                const card = document.createElement("div");
                card.className = `bg-cardBg rounded-2xl p-4 sm:p-5 border ${cardBorder} flex flex-col justify-between space-y-4 hover:border-gray-700 transition duration-200 relative overflow-hidden`;

                card.innerHTML = `
                    <div class="flex flex-shrink-0 items-center justify-between text-xs border-b border-gray-800/40 pb-2">
                        <span class="${isKnockout ? 'text-cupGold' : 'text-gray-400'} font-bold uppercase tracking-wide">
                            ${isKnockout ? match.group : 'Group ' + match.group}
                        </span>
                        <div class="flex items-center gap-2">
                            ${badgeHtml}
                            ${(isPredicted && !isSettled) ? `
                                <button onclick="clearSinglePrediction(${match.id})" class="text-rose-400 hover:text-rose-300 transition text-[10px] font-bold uppercase tracking-wide flex items-center gap-1 bg-rose-500/10 px-2 py-0.5 rounded-md" title="Reset Prediction">
                                    <i class="fa-solid fa-xmark"></i> Clear
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-2 py-1">
                        <div class="flex items-center gap-2.5 sm:gap-3 w-[30%] justify-start overflow-hidden">
                            <span class="font-bold text-sm sm:text-base text-white truncate" title="${homeTeamObj.name}">${homeTeamObj.name}</span>
                        </div>

                        <div class="flex flex-col items-center justify-center w-[30%] shrink-0">
                            <div class="text-base sm:text-lg font-black text-white tracking-widest bg-gray-950/90 px-3 py-1.5 rounded-xl border border-gray-800 min-w-[60px] text-center shadow-inner">
                                ${homeScoreVal} : ${awayScoreVal}
                            </div>
                        </div>

                        <div class="flex items-center gap-2.5 sm:gap-3 w-[40%] justify-end text-right overflow-hidden">
                            <span class="font-bold text-sm sm:text-base text-white truncate" title="${awayTeamObj.name}">${awayTeamObj.name}</span>
                        </div>
                    </div>

                    ${!isSettled ? `
                        <div class="flex items-center justify-between px-2 bg-gray-950/40 rounded-xl p-2 border border-gray-900/60 mt-1">
                            <div class="flex items-center space-x-1.5 justify-start w-[45%]">
                                <button onclick="adjustPrediction(${match.id}, 'home', -1)" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-white font-extrabold text-xs w-6.5 h-6.5 rounded-lg border border-gray-700 transition flex items-center justify-center shadow">-</button>
                                <span class="text-[10px] text-gray-400 font-semibold px-0.5">Score</span>
                                <button onclick="adjustPrediction(${match.id}, 'home', 1)" class="bg-gray-800 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-xs w-6.5 h-6.5 rounded-lg border border-gray-700 transition flex items-center justify-center shadow">+</button>
                            </div>
                            
                            <span class="text-[9px] text-cupGold/90 font-extrabold tracking-wider uppercase shrink-0 text-center px-1">Prediction</span>

                            <div class="flex items-center space-x-1.5 justify-end w-[45%]">
                                <button onclick="adjustPrediction(${match.id}, 'away', -1)" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-white font-extrabold text-xs w-6.5 h-6.5 rounded-lg border border-gray-700 transition flex items-center justify-center shadow">-</button>
                                <span class="text-[10px] text-gray-400 font-semibold px-0.5">Score</span>
                                <button onclick="adjustPrediction(${match.id}, 'away', 1)" class="bg-gray-800 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-xs w-6.5 h-6.5 rounded-lg border border-gray-700 transition flex items-center justify-center shadow">+</button>
                            </div>
                        </div>
                    ` : ''}

                    <div class="border-t border-gray-800/40 pt-2.5 flex flex-wrap items-center justify-between text-[11px] text-gray-500 gap-1">
                        <span class="truncate max-w-[170px]" title="${stadiumData.name}"><i class="fa-solid fa-location-dot text-gray-600 mr-1"></i>${stadiumData.name}</span>
                        <span class="font-medium text-gray-400 flex items-center gap-1.5">
                            <span>${stadiumData.city}</span>
                        </span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function recalculateStandings() {
            Object.keys(TEAMS).forEach(key => {
                TEAMS[key].pts = 0;
                TEAMS[key].w = 0;
                TEAMS[key].d = 0;
                TEAMS[key].l = 0;
                TEAMS[key].gf = 0;
                TEAMS[key].ga = 0;
                TEAMS[key].gd = 0;
            });

            fixtures.forEach(match => {
                // Ignore knockouts in group standings computation
                if(["R32", "R16", "QF", "SF", "3RD", "FINAL"].includes(match.group)) return;

                const pred = predictions[match.id];
                const isPredicted = pred !== undefined;

                let hScore = isPredicted ? pred.homeScore : match.homeScore;
                let aScore = isPredicted ? pred.awayScore : match.awayScore;

                if (hScore !== null && aScore !== null) {
                    const home = TEAMS[match.home];
                    const away = TEAMS[match.away];

                    if (home && away) {
                        home.gf += hScore;
                        home.ga += aScore;
                        home.gd = home.gf - home.ga;

                        away.gf += aScore;
                        away.ga += hScore;
                        away.gd = away.gf - away.ga;

                        if (hScore > aScore) {
                            home.w += 1;
                            home.pts += 3;
                            away.l += 1;
                        } else if (hScore < aScore) {
                            away.w += 1;
                            away.pts += 3;
                            home.l += 1;
                        } else {
                            home.d += 1;
                            home.pts += 1;
                            away.d += 1;
                            away.pts += 1;
                        }
                    }
                }
            });

            renderGroups();
        }

        function getSortedGroupTeams(groupLetter) {
            const groupTeams = Object.keys(TEAMS)
                .map(key => ({ code: key, ...TEAMS[key] }))
                .filter(t => t.group === groupLetter);

            return groupTeams.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd;
                return b.gf - a.gf;
            });
        }

        function renderGroups() {
            const container = document.getElementById("groupStandingsGrid");
            container.innerHTML = "";

            const groups = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"];
            const searchInput = document.getElementById("groupSearch").value.trim().toLowerCase();
            const groupFilter = document.getElementById("groupLetterFilter").value;

            groups.forEach(letter => {
                if (groupFilter !== "ALL" && groupFilter !== letter) return;

                const sortedTeams = getSortedGroupTeams(letter);

                if (searchInput) {
                    const matchesSearch = sortedTeams.some(team => team.name.toLowerCase().includes(searchInput));
                    if (!matchesSearch && !`group ${letter}`.toLowerCase().includes(searchInput)) return;
                }

                if (sortedTeams.length === 0) return;

                const groupCard = document.createElement("div");
                groupCard.className = "bg-cardBg rounded-3xl border border-gray-800 p-5 shadow-xl space-y-4 hover:border-gray-700 transition duration-300";
                
                let rowsHtml = "";
                sortedTeams.forEach((team, index) => {
                    const highlightClass = index < 2 ? "bg-emerald-500/5 text-emerald-400 font-semibold" : "";
                    const rankBadge = index < 2 
                        ? `<span class="bg-emerald-500/15 text-emerald-400 text-[10px] px-1.5 py-0.5 rounded-md font-extrabold">Q</span>` 
                        : `<span class="text-gray-500 text-[10px]">${index + 1}</span>`;

                    rowsHtml += `
                        <tr class="text-xs hover:bg-gray-800/30 transition ${highlightClass}">
                            <td class="py-2.5 px-2 text-center">${rankBadge}</td>
                            <td class="py-2.5 px-2 flex items-center gap-2">
                                <span class="text-lg filter drop-shadow select-none">${team.flag}</span>
                                <span class="font-bold text-white truncate max-w-[110px]" title="${team.name}">${team.name}</span>
                            </td>
                            <td class="py-2.5 px-2 text-center font-bold text-white">${team.pts}</td>
                            <td class="py-2.5 px-2 text-center text-gray-400">${team.w}</td>
                            <td class="py-2.5 px-2 text-center text-gray-400">${team.d}</td>
                            <td class="py-2.5 px-2 text-center text-gray-400">${team.l}</td>

                            <td class="py-2.5 px-2 text-right font-semibold text-gray-300">${team.gd > 0 ? '+' + team.gd : team.gd}</td>
                        </tr>
                    `;
                });

                groupCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                        <h4 class="text-sm font-extrabold text-white tracking-tight">GROUP ${letter}</h4>
                        <span class="text-[10px] text-gray-500 bg-gray-900 px-2 py-0.5 rounded-md">Projected Standings</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">

                                    <th class="py-2 px-2 text-center">GA</th>
                                    <th class="py-2 px-2 text-right">GD</th>
                                </tr>

                `;

            });
        }

        function filterGroups() {
            renderGroups();
        }

        async function fetchRealWorldResults() {
            const targetUrl = 'https://worldcup26.ir/get/games';
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${targetUrl}`
            ];

            let rawData = null;

            for (const proxy of proxies) {
                try {
                    const response = await fetch(proxy, { headers: { 'Accept': 'application/json' } });
                    if (response.ok) {
                        rawData = await response.json();
                        break; 
                    }
                } catch (err) {
                    console.warn(`[API Sync] Proxy failed, attempting next route:`, proxy);
                }
            }

            if (!rawData || !rawData.games || !Array.isArray(rawData.games)) {
                return;
            }

try {
        let stateUpdated = false;

        rawData.events.forEach(apiMatch => {
            // Find the local fixture solely by matching Team Names
            // We do not overwrite time or date, preserving your hardcoded order
            const localFixture = fixtures.find(f => 
                f.home === apiMatch.strHomeTeam && 
                f.away === apiMatch.strAwayTeam
            );

            if (localFixture) {
                const remoteFinished = apiMatch.strStatus === "Match Finished";
                const hasStarted = apiMatch.strStatus !== "Not Started";

                // Parse API scores
                const newHomeScore = hasStarted ? parseInt(apiMatch.intHomeScore, 10) : null;
                const newAwayScore = hasStarted ? parseInt(apiMatch.intAwayScore, 10) : null;

                // Only update if scores actually changed to keep DOM stable
                if (localFixture.homeScore !== newHomeScore || localFixture.awayScore !== newAwayScore) {
                    localFixture.homeScore = newHomeScore;
                    localFixture.awayScore = newAwayScore;
                    localFixture.status = remoteFinished ? "finished" : (hasStarted ? "live" : "scheduled");
                    
                    // Clear user predictions if the real match has finished
                    if (remoteFinished && predictions[localFixture.id]) {
                        delete predictions[localFixture.id];
                    }
                    
                    stateUpdated = true;
                }
            }
        });

                if (stateUpdated) {
                    initTabs(); // Re-sync dates dynamically
                    recalculateStandings();
                    renderMatches();
                }
            } catch (err) {
                console.warn('[API Sync] Error parsing the validated JSON payload:', err.message);
            }
        }
        
        // Initialize State on DOM load
        window.onload = function() {
            initTabs();
            recalculateStandings();
            renderMatches();

            fetchRealWorldResults();
            setInterval(fetchRealWorldResults, 300000); // 5 min background sync
        }
    </script>
